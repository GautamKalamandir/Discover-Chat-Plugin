[project]
name = "discover-chatbot-backend"
version = "0.1.0"
description = "FastAPI agent backend for the Discover Power BI chatbot visual"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.115",
    "fastembed>=0.8",
    "httpx>=0.28",
    "mcp>=1.20",
    "msal>=1.31",
    "openai>=1.50",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=3.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"tests/security/redteam_cases.py" = ["E501"]  # adversarial prompts are long by nature
"tests/fake_fabric_iq.py" = ["N803"]  # parameter names mirror the Fabric IQ tool contract
"app/core/errors.py" = ["S105"]  # error-code names such as TOKEN_EXPIRED are not secrets

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["msal", "msal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not network'"
markers = [
    "integration: requires running infrastructure (docker compose up)",
    "network: downloads models or calls external services; run explicitly with -m network",
    "scenario(n): proves security scenario n of IMPLEMENTATION_PLAN.md section 7 (ADR 0011)",
]
