name: discover-chatbot

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-discover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discover}
      POSTGRES_DB: ${POSTGRES_DB:-discover}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Full local stack (docs/run-locally.md): docker compose --profile app up -d --build ---
  backend:
    profiles: ["app"]
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../backend/.env
    environment:
      # Container paths override the host paths in backend/.env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-discover}:${POSTGRES_PASSWORD:-discover}@postgres:5432/${POSTGRES_DB:-discover}
      ENTRA_CLIENT_CERTIFICATE_PATH: /run/secrets/entra-key.pem
      EMBEDDING_CACHE_DIR: /cache/embeddings
      DIAGNOSTICS_CAPTURE_DIR: /app/spikes/captures
    ports:
      - "8000:8000"
    volumes:
      - ./dev-certs:/certs:ro
      # Entra OBO private key (backend/.env ENTRA_CLIENT_CERTIFICATE_PATH on the host).
      - ${ENTRA_CERT_FILE:-D:/secrets/chatbot-key.pem}:/run/secrets/entra-key.pem:ro
      # Phase 2 capture bundles land on the host (gitignored).
      - ../backend/spikes/captures:/app/spikes/captures
      - embeddings:/cache/embeddings
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request as u; u.urlopen('https://localhost:8000/api/v1/health', context=ssl._create_unverified_context())"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  visual:
    profiles: ["app"]
    build:
      context: ../visual
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./dev-certs/localhost.crt:/root/pbiviz-certs/PowerBICustomVisualTest_public.crt:ro
      - ./dev-certs/localhost.key:/root/pbiviz-certs/PowerBICustomVisualTest_private.key:ro

  # Browser view of the database (local only): http://localhost:8081
  adminer:
    profiles: ["app"]
    image: adminer:5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
  embeddings:
